<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: o app usa a tela toda no iPhone (respeitando o notch pelas safe areas). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- Site que vira app (PWA): ícone, nome e tela cheia ao "Adicionar à Tela de Início". -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gains Club" />
    <!-- O app ocupa a tela toda, por baixo do relógio/bateria; o espaço deles é reservado no CSS abaixo. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* Fundo do app enquanto carrega (evita um flash branco) */
        background-color: #0e0f12;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* App instalado na tela de início (iPhone/Android): a navegação não recebe as "safe areas" no
         navegador, então reservamos aqui o espaço do relógio/bateria (topo) e da barrinha de gestos
         (embaixo). No iPhone, em tela cheia, a altura da página vem descontada da barra de status;
         somamos ela de volta (onde não existe, env() dá 0 e a altura fica 100%). O espaço da barrinha
         de gestos fica na cor da barra de abas (#181A1F), para parecer uma barra só. */
      @media (display-mode: standalone) {
        #root {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          height: calc(100% + env(safe-area-inset-top));
          box-sizing: border-box;
          padding-top: env(safe-area-inset-top);
          /* Só parte da área da barrinha de gestos: a barra de abas fica mais perto da borda, mas sem
             ficar embaixo da barrinha. Em celulares sem barrinha de gestos, isso dá 0. */
          padding-bottom: max(0px, calc(env(safe-area-inset-bottom) - 14px));
          background: linear-gradient(
            to top,
            #181a1f max(0px, calc(env(safe-area-inset-bottom) - 14px)),
            #0e0f12 max(0px, calc(env(safe-area-inset-bottom) - 14px))
          );
        }
      }

      /* Sem o contorno azul ao tocar num campo (o campo já tem borda própria) nem o "flash" cinza ao tocar. */
      input,
      textarea {
        outline: none;
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>

  <body>
    <noscript> Ative o JavaScript para usar o Gains Club. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
