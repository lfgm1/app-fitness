<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: o app usa a tela toda no iPhone (respeitando o notch pelas safe areas). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- Site que vira app (PWA): ícone, nome e tela cheia ao "Adicionar à Tela de Início". -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gains Club" />
    <!-- O app ocupa a tela toda, por baixo do relógio/bateria; o espaço deles é reservado no CSS abaixo. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* Fundo do app enquanto carrega (evita um flash branco) */
        background-color: #0e0f12;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* App instalado na tela de início (iPhone): a navegação não recebe as "safe areas" no navegador,
         então reservamos aqui o espaço do relógio/bateria (topo) e da barrinha de gestos (embaixo).
         100vh = altura total da tela (o 100% do iPhone nesse modo é menor e cortava a barra de abas). */
      @media (display-mode: standalone) {
        html,
        body {
          height: 100vh;
        }
        #root {
          box-sizing: border-box;
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
        }
      }

      /* Sem o contorno azul ao tocar num campo (o campo já tem borda própria) nem o "flash" cinza ao tocar. */
      input,
      textarea {
        outline: none;
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>

  <body>
    <noscript> Ative o JavaScript para usar o Gains Club. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
